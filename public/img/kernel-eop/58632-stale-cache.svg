<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 360" font-family="Consolas, monospace" font-size="12" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#64748b"/></marker>
    <marker id="adanger" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#ef4444"/></marker>
  </defs>
  <rect width="780" height="360" rx="8" fill="#0f172a"/>
  <text x="390" y="25" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="bold">CVE-2026-58632: _GrowListeners Stale Cache Pointer</text>

  <!-- BEFORE -->
  <text x="130" y="52" text-anchor="middle" fill="#60a5fa" font-weight="bold" font-size="12">Before realloc</text>

  <rect x="30" y="62" width="200" height="100" rx="5" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="40" y="82" fill="#e2e8f0" font-weight="bold" font-size="11">tagEDGY_DATA</text>
  <text x="40" y="102" fill="#86efac" font-size="11">+0x08 = A (array ptr)</text>
  <text x="40" y="122" fill="#86efac" font-size="11">+0xB8 = &amp;A[i] (cache)</text>
  <text x="40" y="148" fill="#94a3b8" font-size="10">Both point into array A</text>

  <!-- Array A -->
  <rect x="30" y="180" width="200" height="50" rx="4" fill="#1e293b" stroke="#22c55e" stroke-width="1.2"/>
  <text x="130" y="200" text-anchor="middle" fill="#86efac" font-size="11">Array A (valid)</text>
  <text x="130" y="218" text-anchor="middle" fill="#94a3b8" font-size="10">A[0] A[1] A[2] A[3]</text>

  <!-- Arrows -->
  <line x1="100" y1="162" x2="100" y2="176" stroke="#22c55e" stroke-width="1.2" marker-end="url(#a)"/>
  <line x1="160" y1="162" x2="160" y2="176" stroke="#22c55e" stroke-width="1.2" marker-end="url(#a)"/>

  <!-- Arrow between columns -->
  <line x1="250" y1="140" x2="290" y2="140" stroke="#fbbf24" stroke-width="2" marker-end="url(#a)"/>
  <text x="270" y="132" text-anchor="middle" fill="#fbbf24" font-size="10">grow</text>

  <!-- AFTER (vulnerable) -->
  <text x="420" y="52" text-anchor="middle" fill="#ef4444" font-weight="bold" font-size="12">After realloc (vuln)</text>

  <rect x="300" y="62" width="200" height="100" rx="5" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
  <text x="310" y="82" fill="#e2e8f0" font-weight="bold" font-size="11">tagEDGY_DATA</text>
  <text x="310" y="102" fill="#86efac" font-size="11">+0x08 = B (updated)</text>
  <text x="310" y="122" fill="#f87171" font-weight="bold" font-size="11">+0xB8 = &amp;A[i] (STALE!)</text>
  <text x="310" y="148" fill="#fbbf24" font-size="10">Cache not updated!</text>

  <!-- New Array B -->
  <rect x="300" y="180" width="200" height="50" rx="4" fill="#1e293b" stroke="#22c55e" stroke-width="1.2"/>
  <text x="400" y="200" text-anchor="middle" fill="#86efac" font-size="11">Array B (new, valid)</text>
  <text x="400" y="218" text-anchor="middle" fill="#94a3b8" font-size="10">B[0]...B[7]</text>

  <!-- Old Array A freed -->
  <rect x="300" y="250" width="200" height="40" rx="4" fill="#1e293b" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="400" y="275" text-anchor="middle" fill="#f87171" font-size="11">Array A (FREED)</text>

  <!-- Arrows -->
  <line x1="370" y1="162" x2="370" y2="176" stroke="#22c55e" stroke-width="1.2" marker-end="url(#a)"/>
  <line x1="430" y1="162" x2="430" y2="246" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#adanger)"/>
  <text x="455" y="220" fill="#f87171" font-size="9">dangling!</text>

  <!-- AFTER (patched) -->
  <text x="660" y="52" text-anchor="middle" fill="#22c55e" font-weight="bold" font-size="12">After realloc (patch)</text>

  <rect x="560" y="62" width="200" height="100" rx="5" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
  <text x="570" y="82" fill="#e2e8f0" font-weight="bold" font-size="11">tagEDGY_DATA</text>
  <text x="570" y="102" fill="#86efac" font-size="11">+0x08 = B (updated)</text>
  <text x="570" y="122" fill="#86efac" font-weight="bold" font-size="11">+0xB8 = &amp;B[i] (fixed)</text>
  <text x="570" y="148" fill="#22c55e" font-size="10">Cache updated to new array</text>

  <rect x="560" y="180" width="200" height="50" rx="4" fill="#1e293b" stroke="#22c55e" stroke-width="1.2"/>
  <text x="660" y="200" text-anchor="middle" fill="#86efac" font-size="11">Array B (valid)</text>
  <text x="660" y="218" text-anchor="middle" fill="#94a3b8" font-size="10">B[0]...B[7]</text>

  <line x1="630" y1="162" x2="630" y2="176" stroke="#22c55e" stroke-width="1.2" marker-end="url(#a)"/>
  <line x1="690" y1="162" x2="690" y2="176" stroke="#22c55e" stroke-width="1.2" marker-end="url(#a)"/>

  <!-- Bottom note -->
  <rect x="30" y="310" width="730" height="38" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="40" y="330" fill="#94a3b8" font-size="11">Access via stale +0xB8 -&gt; ValidateHwnd(freed_data) -&gt; read-only primitive (no write, no code exec)</text>
  <text x="40" y="345" fill="#fbbf24" font-size="10">Patch: one line updating +0xB8 after realloc</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
