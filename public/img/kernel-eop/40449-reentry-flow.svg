<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" font-family="Consolas, monospace" font-size="12" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="a1" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#64748b"/></marker>
    <marker id="a2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#ef4444"/></marker>
  </defs>
  <rect width="780" height="480" rx="8" fill="#0f172a"/>

  <!-- Title -->
  <text x="390" y="28" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="bold">CVE-2021-40449: ResetDC Re-entry UAF</text>

  <!-- Outer ResetDC column -->
  <text x="20" y="58" fill="#60a5fa" font-weight="bold" font-size="11">OUTER ResetDC</text>
  <rect x="20" y="68" width="220" height="38" rx="4" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="130" y="92" text-anchor="middle" fill="#94a3b8" font-size="11">GreResetDCInternal</text>
  <line x1="130" y1="106" x2="130" y2="126" stroke="#64748b" stroke-width="1.2" marker-end="url(#a1)"/>

  <rect x="20" y="130" width="220" height="38" rx="4" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="130" y="154" text-anchor="middle" fill="#94a3b8" font-size="11">hdcOpenDCW (holds old PDEV)</text>
  <line x1="130" y1="168" x2="130" y2="188" stroke="#64748b" stroke-width="1.2" marker-end="url(#a1)"/>

  <rect x="20" y="192" width="220" height="38" rx="4" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="130" y="216" text-anchor="middle" fill="#fbbf24" font-size="11">KeUserModeCallback (!)</text>

  <!-- Arrow to usermode -->
  <line x1="245" y1="211" x2="295" y2="211" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#a1)"/>
  <text x="270" y="203" text-anchor="middle" fill="#fbbf24" font-size="9">to user</text>

  <!-- Inner ResetDC column -->
  <text x="300" y="58" fill="#a855f7" font-weight="bold" font-size="11">INNER ResetDC (re-entry)</text>
  <rect x="300" y="130" width="220" height="38" rx="4" fill="#1e293b" stroke="#a855f7" stroke-width="1.2"/>
  <text x="410" y="154" text-anchor="middle" fill="#c084fc" font-size="11">GreResetDCInternal (2nd)</text>
  <line x1="410" y1="168" x2="410" y2="188" stroke="#64748b" stroke-width="1.2" marker-end="url(#a1)"/>

  <rect x="300" y="192" width="220" height="38" rx="4" fill="#1e293b" stroke="#a855f7" stroke-width="1.2"/>
  <text x="410" y="216" text-anchor="middle" fill="#c084fc" font-size="11">Creates new DC/PDEV</text>
  <line x1="410" y1="230" x2="410" y2="250" stroke="#64748b" stroke-width="1.2" marker-end="url(#a1)"/>

  <rect x="300" y="254" width="220" height="38" rx="4" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
  <text x="410" y="278" text-anchor="middle" fill="#f87171" font-weight="bold" font-size="11">FREES old PDEV</text>

  <!-- Return arrow -->
  <path d="M300,292 L270,292 L270,268 L240,268" fill="none" stroke="#fbbf24" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#a1)"/>
  <text x="270" y="308" text-anchor="middle" fill="#fbbf24" font-size="9">returns</text>

  <!-- Resume outer -->
  <rect x="20" y="320" width="220" height="38" rx="4" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
  <text x="130" y="344" text-anchor="middle" fill="#f87171" font-weight="bold" font-size="11">Uses FREED PDEV ptr (UAF)</text>
  <line x1="130" y1="358" x2="130" y2="378" stroke="#ef4444" stroke-width="1.2" marker-end="url(#a2)"/>

  <rect x="20" y="382" width="220" height="38" rx="4" fill="#1e293b" stroke="#f97316" stroke-width="1.5"/>
  <text x="130" y="406" text-anchor="middle" fill="#fb923c" font-size="11">DrvResetPDEV call hijacked</text>

  <!-- Exploitation column -->
  <text x="560" y="58" fill="#22c55e" font-weight="bold" font-size="11">EXPLOITATION</text>
  <rect x="560" y="130" width="200" height="38" rx="4" fill="#1e293b" stroke="#22c55e" stroke-width="1.2"/>
  <text x="660" y="154" text-anchor="middle" fill="#86efac" font-size="11">Palette heap spray</text>
  <line x1="660" y1="168" x2="660" y2="188" stroke="#64748b" stroke-width="1.2" marker-end="url(#a1)"/>

  <rect x="560" y="192" width="200" height="38" rx="4" fill="#1e293b" stroke="#22c55e" stroke-width="1.2"/>
  <text x="660" y="216" text-anchor="middle" fill="#86efac" font-size="11">Reclaim PDEV slot</text>
  <line x1="660" y1="230" x2="660" y2="250" stroke="#64748b" stroke-width="1.2" marker-end="url(#a1)"/>

  <rect x="560" y="254" width="200" height="38" rx="4" fill="#1e293b" stroke="#22c55e" stroke-width="1.2"/>
  <text x="660" y="278" text-anchor="middle" fill="#86efac" font-size="11">RtlSetAllBits(Token)</text>
  <line x1="660" y1="292" x2="660" y2="312" stroke="#64748b" stroke-width="1.2" marker-end="url(#a1)"/>

  <rect x="560" y="316" width="200" height="38" rx="4" fill="#22c55e20" stroke="#22c55e" stroke-width="2"/>
  <text x="660" y="340" text-anchor="middle" fill="#22c55e" font-weight="bold" font-size="12">SYSTEM</text>

  <!-- Patch box -->
  <rect x="300" y="380" width="460" height="55" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="310" y="400" fill="#fbbf24" font-weight="bold" font-size="11">Patch:</text>
  <text x="310" y="420" fill="#94a3b8" font-size="11">if (cExclusiveLock &gt; 1) return ERROR_INVALID_HANDLE;</text>
  <text x="490" y="400" fill="#94a3b8" font-size="10">Re-entry detected, bail out.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
