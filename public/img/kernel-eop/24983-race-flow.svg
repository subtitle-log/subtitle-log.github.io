<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" font-family="Consolas, monospace" font-size="12" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#64748b"/></marker>
    <marker id="ar2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#ef4444"/></marker>
  </defs>
  <rect width="780" height="400" rx="8" fill="#0f172a"/>
  <text x="390" y="25" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="bold">CVE-2025-24983: W32PROCESS Race Condition</text>

  <!-- Timeline axis -->
  <line x1="140" y1="50" x2="140" y2="340" stroke="#475569" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="390" y1="50" x2="390" y2="340" stroke="#475569" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="620" y1="50" x2="620" y2="340" stroke="#475569" stroke-width="1" stroke-dasharray="3,3"/>

  <text x="140" y="45" text-anchor="middle" fill="#60a5fa" font-weight="bold" font-size="11">CPU 0: PoC (parent)</text>
  <text x="390" y="45" text-anchor="middle" fill="#a855f7" font-weight="bold" font-size="11">CPU 0: victim T1</text>
  <text x="620" y="45" text-anchor="middle" fill="#f87171" font-weight="bold" font-size="11">CPU 1: PoC T2 (WFI)</text>

  <!-- Step 1 -->
  <rect x="40" y="60" width="200" height="32" rx="4" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="140" y="80" text-anchor="middle" fill="#94a3b8" font-size="10">CreateProcess(SUSPENDED)</text>
  <line x1="140" y1="92" x2="140" y2="108" stroke="#64748b" stroke-width="1" marker-end="url(#ar)"/>

  <!-- Step 2 -->
  <rect x="40" y="110" width="200" height="32" rx="4" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="140" y="130" text-anchor="middle" fill="#94a3b8" font-size="10">ResumeThread (child)</text>

  <!-- Arrow to T1 -->
  <line x1="240" y1="126" x2="290" y2="156" stroke="#64748b" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#ar)"/>

  <!-- T1 steps -->
  <rect x="290" y="150" width="200" height="32" rx="4" fill="#1e293b" stroke="#a855f7" stroke-width="1.2"/>
  <text x="390" y="170" text-anchor="middle" fill="#c084fc" font-size="10">AllocateW32Process</text>
  <line x1="390" y1="182" x2="390" y2="198" stroke="#64748b" stroke-width="1" marker-end="url(#ar)"/>

  <rect x="290" y="200" width="200" height="32" rx="4" fill="#fbbf2415" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="390" y="220" text-anchor="middle" fill="#fbbf24" font-size="10">Address exposed (0x20 NOT set)</text>

  <!-- Race window -->
  <rect x="275" y="240" width="230" height="28" rx="4" fill="#ef444420" stroke="#ef4444" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="390" y="258" text-anchor="middle" fill="#f87171" font-size="10" font-weight="bold">RACE WINDOW</text>

  <!-- T2 steps -->
  <rect x="520" y="110" width="200" height="32" rx="4" fill="#1e293b" stroke="#f87171" stroke-width="1.2"/>
  <text x="620" y="130" text-anchor="middle" fill="#fca5a5" font-size="10">WaitForInputIdle(child)</text>
  <line x1="620" y1="142" x2="620" y2="158" stroke="#64748b" stroke-width="1" marker-end="url(#ar)"/>

  <rect x="520" y="160" width="200" height="32" rx="4" fill="#1e293b" stroke="#f87171" stroke-width="1.2"/>
  <text x="620" y="180" text-anchor="middle" fill="#fca5a5" font-size="10">Spinning on W32PROCESS...</text>
  <line x1="620" y1="192" x2="620" y2="238" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#ar2)"/>

  <rect x="520" y="240" width="200" height="32" rx="4" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
  <text x="620" y="260" text-anchor="middle" fill="#f87171" font-weight="bold" font-size="10">Reads partial-init object!</text>

  <!-- Result -->
  <line x1="620" y1="272" x2="620" y2="288" stroke="#64748b" stroke-width="1" marker-end="url(#ar)"/>
  <rect x="520" y="290" width="200" height="32" rx="4" fill="#1e293b" stroke="#f97316" stroke-width="1.5"/>
  <text x="620" y="310" text-anchor="middle" fill="#fb923c" font-size="10">PreviousMode 1 -&gt; 0</text>
  <line x1="620" y1="322" x2="620" y2="338" stroke="#64748b" stroke-width="1" marker-end="url(#ar)"/>
  <rect x="520" y="340" width="200" height="32" rx="4" fill="#22c55e20" stroke="#22c55e" stroke-width="2"/>
  <text x="620" y="360" text-anchor="middle" fill="#22c55e" font-weight="bold" font-size="11">Kernel R/W -> SYSTEM</text>

  <!-- Patch note -->
  <rect x="20" y="340" width="280" height="45" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="30" y="358" fill="#fbbf24" font-weight="bold" font-size="10">Patch:</text>
  <text x="30" y="375" fill="#94a3b8" font-size="10">if (flags &amp; 0x20 == 0) goto FAIL;</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
