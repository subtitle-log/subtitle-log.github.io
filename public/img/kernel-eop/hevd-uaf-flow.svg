<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" font-family="Consolas, monospace" font-size="13" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="800" height="320" rx="8" fill="#0f172a"/>

  <!-- Step 1: ALLOCATE -->
  <rect x="20" y="20" width="170" height="120" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="105" y="42" text-anchor="middle" fill="#60a5fa" font-weight="bold" font-size="12">1. ALLOCATE</text>
  <text x="30" y="62" fill="#94a3b8" font-size="11">ExAllocatePool(0x60)</text>
  <text x="30" y="80" fill="#94a3b8" font-size="11">+0x00: Callback ptr</text>
  <text x="30" y="98" fill="#94a3b8" font-size="11">+0x08: Buffer (0x41)</text>
  <text x="30" y="120" fill="#22c55e" font-size="11">global = &amp;obj</text>

  <!-- Arrow 1->2 -->
  <line x1="195" y1="80" x2="225" y2="80" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 2: FREE -->
  <rect x="230" y="20" width="170" height="120" rx="6" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
  <text x="315" y="42" text-anchor="middle" fill="#f87171" font-weight="bold" font-size="12">2. FREE</text>
  <text x="240" y="62" fill="#94a3b8" font-size="11">ExFreePoolWithTag()</text>
  <text x="240" y="82" fill="#fbbf24" font-size="11">global NOT cleared!</text>
  <text x="240" y="102" fill="#94a3b8" font-size="11">Pool chunk freed</text>
  <text x="240" y="122" fill="#ef4444" font-size="11">Dangling pointer</text>

  <!-- Arrow 2->3 -->
  <line x1="405" y1="80" x2="435" y2="80" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 3: FAKE -->
  <rect x="440" y="20" width="170" height="120" rx="6" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
  <text x="525" y="42" text-anchor="middle" fill="#c084fc" font-weight="bold" font-size="12">3. FAKE (reclaim)</text>
  <text x="450" y="62" fill="#94a3b8" font-size="11">Alloc 0x58 bytes</text>
  <text x="450" y="82" fill="#94a3b8" font-size="11">Same pool bucket</text>
  <text x="450" y="102" fill="#a855f7" font-size="11">+0x00: 0x424242...</text>
  <text x="450" y="122" fill="#94a3b8" font-size="11">Reclaims freed slot</text>

  <!-- Arrow 3->4 -->
  <line x1="615" y1="80" x2="645" y2="80" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 4: USE -->
  <rect x="650" y="20" width="130" height="120" rx="6" fill="#1e293b" stroke="#f97316" stroke-width="1.5"/>
  <text x="715" y="42" text-anchor="middle" fill="#fb923c" font-weight="bold" font-size="12">4. USE</text>
  <text x="660" y="62" fill="#94a3b8" font-size="11">global-&gt;Callback()</text>
  <text x="660" y="82" fill="#94a3b8" font-size="11">Calls 0x424242...</text>
  <text x="660" y="106" fill="#f97316" font-weight="bold" font-size="11">RIP CONTROL</text>

  <!-- Memory layout -->
  <rect x="20" y="170" width="760" height="130" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="40" y="195" fill="#e2e8f0" font-weight="bold" font-size="12">Pool Memory (0x60 bytes at 0xffff...a050)</text>

  <rect x="40" y="210" width="120" height="35" rx="3" fill="#292524" stroke="#3b82f6" stroke-width="1"/>
  <text x="100" y="232" text-anchor="middle" fill="#60a5fa" font-size="10">+0x00 Callback</text>

  <rect x="170" y="210" width="400" height="35" rx="3" fill="#292524" stroke="#475569" stroke-width="1"/>
  <text x="370" y="232" text-anchor="middle" fill="#94a3b8" font-size="10">+0x08 Buffer (0x54 bytes)</text>

  <text x="40" y="275" fill="#fbbf24" font-size="11">After FAKE: Callback = attacker-controlled value from user input</text>
  <text x="40" y="293" fill="#94a3b8" font-size="11">Fix: set global = NULL after Free (one line)</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
